name: Recent activity

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

concurrency:
  group: recent-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Readme-Workflows/recent-activity@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
