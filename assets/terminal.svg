<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" viewBox="0 0 1180 440" fill="none" role="img" aria-label="theconformist@github — terminal profile card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39d353" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect width="1180" height="440" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="1180" height="440" fill="url(#bg)"/>
    <rect width="1180" height="440" fill="url(#glow)"/>

    <!-- window chrome -->
    <path d="M1 44.5H1179" stroke="#21262d"/>
    <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="22" r="6" fill="#27c93f"/>
    <text x="590" y="26.5" text-anchor="middle" fill="#8b949e"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="12" letter-spacing="0.6">theconformist@github: ~/profile</text>

    <!-- prompt -->
    <text x="48" y="84" fill="#39d353"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="14">❯ neofetch</text>
    <rect x="139" y="71" width="8" height="16" fill="#39d353">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <!-- code block -->
    <text x="48" y="122" fill="#484f58"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="11">// ~/profile/src/main.rs</text>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" xml:space="preserve">
      <text x="62" y="148" text-anchor="end" fill="#30363d">1</text>
      <text x="78" y="148"><tspan fill="#d2a8ff">impl</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#56d4dd">Engineer</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#d2a8ff">for</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#56d4dd">Me</tspan><tspan fill="#8b949e"> {</tspan></text>

      <text x="62" y="167" text-anchor="end" fill="#30363d">2</text>
      <text x="78" y="167"><tspan fill="#c9d1d9">    </tspan><tspan fill="#d2a8ff">fn</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#39d353">ship</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#ffa657">&amp;self</tspan><tspan fill="#c9d1d9">) -&gt; </tspan><tspan fill="#56d4dd">Result</tspan><tspan fill="#c9d1d9">&lt;(), </tspan><tspan fill="#56d4dd">Bug</tspan><tspan fill="#c9d1d9">&gt;</tspan><tspan fill="#8b949e"> {</tspan></text>

      <text x="62" y="186" text-anchor="end" fill="#30363d">3</text>
      <text x="78" y="186"><tspan fill="#c9d1d9">        </tspan><tspan fill="#ffa657">self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#39d353">learn</tspan><tspan fill="#c9d1d9">()?;</tspan></text>

      <text x="62" y="205" text-anchor="end" fill="#30363d">4</text>
      <text x="78" y="205"><tspan fill="#c9d1d9">        </tspan><tspan fill="#ffa657">self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#39d353">build</tspan><tspan fill="#c9d1d9">()?;</tspan></text>

      <text x="62" y="224" text-anchor="end" fill="#30363d">5</text>
      <text x="78" y="224"><tspan fill="#c9d1d9">        </tspan><tspan fill="#ffa657">self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#39d353">measure</tspan><tspan fill="#c9d1d9">()?;</tspan></text>

      <text x="62" y="243" text-anchor="end" fill="#30363d">6</text>
      <text x="78" y="243"><tspan fill="#c9d1d9">        </tspan><tspan fill="#ffa657">Ok</tspan><tspan fill="#c9d1d9">(())</tspan></text>

      <text x="62" y="262" text-anchor="end" fill="#30363d">7</text>
      <text x="78" y="262" fill="#8b949e">    }</text>

      <text x="62" y="281" text-anchor="end" fill="#30363d">8</text>
      <text x="78" y="281" fill="#8b949e">}</text>
    </g>
    <text x="48" y="318" fill="#8b949e"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="12"><tspan fill="#39d353">▍</tspan>systems · rust · c · python</text>

    <!-- neofetch block -->
    <text x="470" y="122" fill="#56d4dd" font-weight="600"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="14">theconformist@github</text>
    <path d="M470 132H760" stroke="#30363d"/>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">
      <text x="470" y="166" fill="#39d353">OS</text><text x="590" y="166" fill="#c9d1d9">Arch Linux · Hyprland</text>
      <text x="470" y="189" fill="#39d353">Shell</text><text x="590" y="189" fill="#c9d1d9">zsh · starship · tmux</text>
      <text x="470" y="212" fill="#39d353">Editor</text><text x="590" y="212" fill="#c9d1d9">Neovim (btw)</text>
      <text x="470" y="235" fill="#39d353">Langs</text><text x="590" y="235" fill="#c9d1d9">Rust · C · Python</text>
      <text x="470" y="258" fill="#39d353">Runtime</text><text x="590" y="258" fill="#c9d1d9">Docker · WASM · Linux</text>
      <text x="470" y="281" fill="#39d353">Focus</text><text x="590" y="281" fill="#c9d1d9">systems · edge ML · OSS</text>
      <text x="470" y="304" fill="#39d353">Uptime</text><text x="590" y="304" fill="#c9d1d9">learning in public</text>
    </g>
    <g>
      <rect x="470" y="324" width="14" height="14" rx="3" fill="#39d353"/>
      <rect x="492" y="324" width="14" height="14" rx="3" fill="#56d4dd"/>
      <rect x="514" y="324" width="14" height="14" rx="3" fill="#d2a8ff"/>
      <rect x="536" y="324" width="14" height="14" rx="3" fill="#ffa657"/>
      <rect x="558" y="324" width="14" height="14" rx="3" fill="#ff7b72"/>
      <rect x="580" y="324" width="14" height="14" rx="3" fill="#c9d1d9"/>
      <rect x="602" y="324" width="14" height="14" rx="3" fill="#8b949e"/>
      <rect x="624" y="324" width="14" height="14" rx="3" fill="#1f6feb"/>
    </g>

    <!-- decorative glyph -->
    <text x="975" y="275" text-anchor="middle" fill="#39d353" opacity="0.07" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="150">&lt;/&gt;</text>
    <text x="975" y="312" text-anchor="middle" fill="#8b949e" opacity="0.6" font-size="11" letter-spacing="3"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">BUILD SMALL · SHIP FAST</text>

    <!-- footer -->
    <path d="M48 372H1132" stroke="url(#rule)"/>
    <text x="48" y="402" fill="#8b949e"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="12"><tspan fill="#39d353">▍</tspan>fast is a feature. correct is non-negotiable.</text>
    <text x="1132" y="402" text-anchor="end" fill="#8b949e"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="12">github.com/TheNonConformist</text>
  </g>

  <rect x="0.5" y="0.5" width="1179" height="439" rx="13.5" stroke="#21262d"/>
</svg>
